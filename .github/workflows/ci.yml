name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations to a fresh local D1
        run: npm run db:migrate:local
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright's Firefox
        run: npx playwright-core install --with-deps firefox
      # Builds, starts the Worker on a throwaway local D1 and drives it in the runner's Chrome and Firefox.
      - run: npm run test:browser
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
