name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations to a fresh local D1
        run: npm run db:migrate:local
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
