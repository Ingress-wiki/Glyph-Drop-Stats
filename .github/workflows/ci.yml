name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations to a fresh local D1
        run: npm run db:migrate:local
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright's Firefox
        run: npx playwright-core install --with-deps firefox
      # Builds, starts the Worker on a throwaway local D1 and drives it in the runner's Chrome.
      - run: npm run test:browser
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-screenshots
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

  deploy:
    # Only main, and only once everything above passed. Add required reviewers to the
    # `production` environment on GitHub to approve each deploy by hand instead.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [check, browser]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stats.ingress.wiki
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Migrations are additive and run before the code that needs them.
      - run: npm run db:migrate:production
      - run: npm run deploy
      - name: Check the live site
        run: |
          curl -fsS https://stats.ingress.wiki/api/health
          curl -fsS https://stats.ingress.wiki/api/config
          curl -fsS -o /dev/null https://stats.ingress.wiki/
